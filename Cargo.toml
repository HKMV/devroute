[package]
name = "devroute"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

#log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }
tracing-appender = "0.2"

time = { version = "0.3", features = ["parsing", "macros"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
httparse = "1.10"
dark-light = "3.0.0"
fltk = { version = "1.5.23", features = ["fltk-bundled"] }
fltk-theme = "0.7.9"
rust-i18n = "4"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"
