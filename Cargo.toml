[package]
name = "devroute"
version = "0.8.1"
edition = "2024"
repository = "https://github.com/HKMV/devroute"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

#log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }
tracing-appender = "0.2"

time = { version = "0.3", features = ["parsing", "macros"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
httparse = "1.10"
# 镜像站点的 https 上游（ring provider：不依赖 cmake/nasm，与 fltk 的 C 工具链共用）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
dark-light = "3.0.0"
fltk = { version = "1.5.23", features = ["fltk-bundled"] }
fltk-theme = "0.7.9"
rust-i18n = "4"
sys-locale = "0.3"

[profile.release]
# 体积优先：单文件分发，用户直接下载即用，几 MB 越小越好
opt-level = "z"   # 以体积为目标（关闭循环向量化等体积大户）
lto = true        # 跨 crate 内联 + 死代码消除
codegen-units = 1
panic = "abort"   # 去掉 panic 展开表
strip = true      # 去掉符号表

# 构建脚本（fltk-sys 要现场编译 FLTK）别跟着上体积优化，纯属拖慢编译
[profile.release.build-override]
opt-level = 0
codegen-units = 256

[build-dependencies]
winres = "0.1.12"
