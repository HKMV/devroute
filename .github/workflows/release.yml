name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # fltk GUI 库在 Linux 下链接需要 X11/pango/cairo 等系统库
      - name: Install Linux dependencies (fltk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libxft-dev libfontconfig-dev libpango1.0-dev libcairo2-dev

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Run cargo tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release artifact
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/devroute.exe release/devroute-${{ matrix.os }}.exe
          else
            cp target/release/devroute release/devroute-${{ matrix.os }}
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devroute-${{ matrix.os }}
          path: release/*

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Release 正文来自 CHANGELOG.md：取与该 tag 对应的 `## [x.y.z]` 小节，再补一段下载说明。
      # 找不到小节就退回一句占位文案，绝不因为文档缺失让发布失败。
      - name: Build release notes from CHANGELOG.md
        run: |
          python3 - "${{ github.ref_name }}" > notes.md <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except OSError:
              text = ""  # 老 tag 上可能还没有这个文件，走下面的占位文案
          lines = text.splitlines()

          start = None
          for i, line in enumerate(lines):
              if re.match(r"^##\s+\[%s\]" % re.escape(version), line):
                  start = i + 1
                  break

          section = []
          if start is not None:
              for line in lines[start:]:
                  if re.match(r"^##\s+\[", line):
                      break
                  section.append(line)
          body = "\n".join(section).strip()
          print(body if body else "(本版本没有单独的更新说明，详见 CHANGELOG.md)")
          PY
          {
            cat notes.md
            cat <<'MD'

          ---

          ### 下载 / Download

          | 平台 / Platform | 文件 / File |
          |---|---|
          | Windows | `devroute-windows.exe`（双击即用） |
          | Linux | `devroute-linux`（`chmod +x` 后运行） |
          | macOS | `devroute-macos`（`chmod +x` 后运行） |

          单文件、静态链接，不需要安装任何运行时。
          Single-file static binaries — no runtime required.
          MD
          } > body.md
          cp body.md notes.md
          echo "----- release body -----"
          cat body.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: devroute-ubuntu-latest
          path: release/ubuntu

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: devroute-macos-latest
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: devroute-windows-latest
          path: release/windows

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body_path: body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/ubuntu/devroute-ubuntu-latest
          asset_name: devroute-linux
          asset_content_type: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/macos/devroute-macos-latest
          asset_name: devroute-macos
          asset_content_type: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows binary
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/windows/devroute-windows-latest.exe
          asset_name: devroute-windows.exe
          asset_content_type: application/octet-stream
          token: ${{ secrets.GITHUB_TOKEN }}
